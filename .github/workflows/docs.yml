name: Deploy docs

# Auto-deploy on every push to `develop` that actually touches the
# docs source — VitePress content, the shared brand palette, or this
# workflow itself. Manual runs are still allowed from any branch via
# the Actions tab.
#
# Heads-up: the `deploy` job below targets the `github-pages`
# environment. Repo Settings → Environments → github-pages must list
# `develop` (or "All branches") under "Deployment branches and tags",
# otherwise the deploy step will be blocked even when the build
# succeeds.
on:
  push:
    branches: [develop]
    paths:
      - 'docs/**'
      - 'internal/ui/theme/palette.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs/web/package-lock.json

      - name: Install
        working-directory: docs/web
        run: npm ci

      - name: Build
        working-directory: docs/web
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/web/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
